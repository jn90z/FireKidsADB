name: Signed Android Release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FIREKIDS_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing FIREKIDS_KEYSTORE_BASE64"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/firekids-release.jks"
      - name: Build signed release APK
        env:
          FIREKIDS_KEYSTORE_PATH: ${{ runner.temp }}/firekids-release.jks
          FIREKIDS_KEYSTORE_PASSWORD: ${{ secrets.FIREKIDS_KEYSTORE_PASSWORD }}
          FIREKIDS_KEY_ALIAS: ${{ secrets.FIREKIDS_KEY_ALIAS }}
          FIREKIDS_KEY_PASSWORD: ${{ secrets.FIREKIDS_KEY_PASSWORD }}
        run: |
          test -n "$FIREKIDS_KEYSTORE_PASSWORD" && test -n "$FIREKIDS_KEY_ALIAS" && test -n "$FIREKIDS_KEY_PASSWORD"
          gradle --no-daemon :app:assembleRelease
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: FireKidsADB-signed-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
