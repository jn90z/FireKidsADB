plugins { id 'com.android.application' }

android {
    namespace 'com.jn90z.firekidsadb'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jn90z.firekidsadb'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '0.1.0'
    }

    signingConfigs {
        release {
            def storeFilePath = System.getenv('FIREKIDS_KEYSTORE_PATH')
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword System.getenv('FIREKIDS_KEYSTORE_PASSWORD')
                keyAlias System.getenv('FIREKIDS_KEY_ALIAS')
                keyPassword System.getenv('FIREKIDS_KEY_PASSWORD')
            }
        }
    }

    // Fire OS compatibility build: API 28 is deliberate for this prototype.
    // Re-evaluate targetSdk and child-profile behavior before public distribution.
    lint {
        disable 'ExpiredTargetSdkVersion'
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('FIREKIDS_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
    }
}
